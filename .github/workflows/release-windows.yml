name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.4.0)'
        required: false
        default: 'v0.4.0'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Go Tests
        run: go test -v -count=1 ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Install NSIS
        run: |
          choco install nsis -y
          if (Test-Path "C:\Program Files (x86)\NSIS") {
            echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          }
          if (Test-Path "C:\Program Files\NSIS") {
            echo "C:\Program Files\NSIS" >> $env:GITHUB_PATH
          }

      - name: Verify NSIS Installation
        run: makensis /VERSION

      - name: Determine Version Tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_TAG=$(node -p "require('./wails.json').info.productVersion || '0.4.0'")
          fi
          
          # Sanitize tag: replace slashes with dashes, ensure 'v' prefix
          CLEAN_TAG=$(echo "$RAW_TAG" | tr '/' '-')
          if [[ ! "$CLEAN_TAG" =~ ^v ]]; then
            CLEAN_TAG="v$CLEAN_TAG"
          fi
          
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $CLEAN_TAG"

      - name: Build Windows Executable
        run: wails build -s

      - name: Build NSIS Setup Installer
        run: wails build -nsis -s

      - name: Prepare Release Assets
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.version.outputs.tag }}"
          mkdir -p release-dist
          
          echo "Listing build/bin directory:"
          ls -la build/bin/
          
          # 1. Standalone Executable
          if [ ! -f "build/bin/BlockAds-Desktop.exe" ]; then
            echo "Error: build/bin/BlockAds-Desktop.exe not found!"
            exit 1
          fi
          cp build/bin/BlockAds-Desktop.exe "release-dist/BlockAds-Desktop-${VERSION}-windows-amd64.exe"
          
          # 2. NSIS Installer
          SETUP_FILE=$(ls build/bin/*installer.exe build/bin/*setup.exe 2>/dev/null | head -n 1)
          if [ -n "$SETUP_FILE" ]; then
            echo "Found NSIS installer: $SETUP_FILE"
            cp "$SETUP_FILE" "release-dist/BlockAds-Desktop-${VERSION}-windows-amd64-setup.exe"
          else
            echo "Error: NSIS installer binary not found in build/bin!"
            exit 1
          fi
          
          # 3. Portable Bundle ZIP
          mkdir -p portable-staging/data
          cp build/bin/BlockAds-Desktop.exe portable-staging/
          cp build/windows/portable/portable.marker portable-staging/
          cp build/windows/portable/README-PORTABLE.txt portable-staging/
          
          cd portable-staging
          7z a "../release-dist/BlockAds-Desktop-${VERSION}-windows-amd64-portable.zip" *
          cd ..
          
          # 4. Generate SHA256SUMS.txt manifest
          cd release-dist
          sha256sum BlockAds-Desktop* > SHA256SUMS.txt
          echo "Generated Checksum Manifest:"
          cat SHA256SUMS.txt
          cd ..
          
          echo "Prepared release assets in release-dist/:"
          ls -la release-dist/

      - name: Upload Artifacts to Job Summary
        uses: actions/upload-artifact@v7
        with:
          name: BlockAds-Desktop-${{ steps.version.outputs.tag }}-release-assets
          path: release-dist/*
          if-no-files-found: error

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "BlockAds Desktop ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
