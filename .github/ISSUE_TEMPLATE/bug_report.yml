name: Bug Report
description: Report an issue or bug encountered in BlockAds Desktop
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible so we can reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: BlockAds Desktop Version
      description: What version or commit SHA of BlockAds Desktop are you using?
      placeholder: e.g., v0.4.0 or commit abc1234
    validations:
      required: true
  - type: dropdown
    id: run_mode
    attributes:
      label: Execution Mode
      description: Are you running the portable version or an installed build?
      options:
        - "Installed Mode (%LOCALAPPDATA%\\BlockAds Desktop)"
        - "Portable Mode (data/ folder alongside executable)"
        - "Development Mode (wails dev)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics / Logs
      description: Paste any error messages, dev console errors, or relevant query diagnostics.
      render: shell
